name: Refresh profile stats

on:
  schedule:
    # Twice a day, at 05:20 and 17:20 UTC.
    - cron: '20 5,17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull live numbers into the README and cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_stats.py

      - name: Commit if anything moved
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "stats unchanged"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am 'chore: refresh profile stats'
          git push
