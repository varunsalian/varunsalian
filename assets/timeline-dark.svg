<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 208" width="1000" height="208" role="img" aria-label="Career timeline: Happiest Minds 2019 to 2021, Oracle 2021 to 2022, Jio Platforms 2022 to 2023, Opendoor 2024 to 2025, LegalZoom SDE 3 2025 to 2026, with Debrify built alongside since August 2025.">
  <rect x="0.5" y="0.5" width="999" height="207" rx="10" fill="#0F141B" stroke="#21262D"/>
  <line x1="52" y1="104" x2="948" y2="104" stroke="#30363D" stroke-width="2"/>
  <g font-family="Menlo,Monaco,Consolas,'Courier New',monospace">
    <circle cx="88" cy="104" r="7" fill="#5B54F0"/>
    <circle cx="292" cy="104" r="7" fill="#5B54F0"/>
    <circle cx="496" cy="104" r="7" fill="#5B54F0"/>
    <circle cx="700" cy="104" r="7" fill="#5B54F0"/>
    <circle cx="904" cy="104" r="7" fill="#5B54F0"/>
    <g font-size="13.5" fill="#E6EDF3" text-anchor="middle">
    <text x="88" y="74">Happiest Minds</text>
    <text x="292" y="74">Oracle</text>
    <text x="496" y="74">Jio Platforms</text>
    <text x="700" y="74">Opendoor</text>
    <text x="904" y="74">LegalZoom</text>
    </g>
    <g font-size="11" fill="#6E7681" text-anchor="middle">
    <text x="88" y="52">2019 – 2021</text>
    <text x="292" y="52">2021 – 2022</text>
    <text x="496" y="52">2022 – 2023</text>
    <text x="700" y="52">2024 – 2025</text>
    <text x="904" y="52">2025 – 2026</text>
    </g>
    <g font-size="11.5" fill="#8B949E" text-anchor="middle">
    <text x="88" y="133">SE → Senior</text>
    <text x="292" y="133">SDE 2</text>
    <text x="496" y="133">SDE 2</text>
    <text x="700" y="133">SDE 2</text>
    <text x="904" y="133">SDE 3</text>
    </g>
    <!-- Debrify's track starts where the repo actually starts: 2 Aug 2025, which
         lands inside the LegalZoom span, not back at Opendoor. -->
    <line x1="866" y1="172" x2="948" y2="172" stroke="#7EE787" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="866" cy="172" r="4.5" fill="#7EE787"/>
    <text x="850" y="176" font-size="11.5" fill="#7EE787" text-anchor="end">debrify — 2,517 commits since Aug 2025, alongside the day job</text>
  </g>
</svg>
