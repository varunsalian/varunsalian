<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-label="Terminal session: varun salian, backend systems and cross-platform apps, Seven years across LegalZoom, Opendoor, Jio Platforms and Oracle. Ships debrify and stremio-addon-importer.">
